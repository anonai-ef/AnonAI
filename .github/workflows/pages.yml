# Builds the dashboard in web/ and publishes web/dist to the gh-pages branch on every push to main.
# GitHub serves a public repo's gh-pages branch at https://<user>.github.io/<repo>/ without any settings change;
# if the site does not appear within a few minutes, set Settings → Pages → Source to "Deploy from a branch",
# branch gh-pages, folder / (root). The Vite base is "./", so no path configuration is needed.
name: dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && yarn --cwd web install --frozen-lockfile
      - run: yarn --cwd web build
      - run: touch web/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
